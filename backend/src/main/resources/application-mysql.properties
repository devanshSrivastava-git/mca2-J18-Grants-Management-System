spring.application.name=grants-management-system-mysql
server.port=8088

# MySQL Database Configuration (Matches MySQL Workbench)
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:grants_db}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:}

# Hibernate MySQL Dialect
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# JWT Security
jwt.secret=GrantsManagementSystemGovernmentOfIndiaSecretKeyForJWTAuthentication2026SecureMustBe256Bits
jwt.expirationMs=86400000

# CORS
cors.allowed-origins=http://localhost:4200,http://127.0.0.1:4200
