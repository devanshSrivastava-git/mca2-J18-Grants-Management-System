spring.application.name=grants-management-system
server.port=8088

# Local persistent database file in Oracle compatibility mode
spring.datasource.url=jdbc:h2:file:./data/grantsdb;MODE=Oracle;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA & Hibernate configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# H2 Console (for debugging and inspecting relational tables)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JWT Security
jwt.secret=GrantsManagementSystemGovernmentOfIndiaSecretKeyForJWTAuthentication2026SecureMustBe256Bits
jwt.expirationMs=86400000

# CORS
cors.allowed-origins=http://localhost:4200,http://127.0.0.1:4200
