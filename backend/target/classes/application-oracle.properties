spring.application.name=grants-management-system-oracle
server.port=8088

# Production Oracle Database 21c XE Configuration
spring.datasource.url=jdbc:oracle:thin:@//${ORACLE_HOST:localhost}:${ORACLE_PORT:1521}/${ORACLE_SERVICE:XEPDB1}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.username=${ORACLE_USER:grants_admin}
spring.datasource.password=${ORACLE_PASSWORD:grants123}

# Hibernate Oracle Dialect
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# JWT Security
jwt.secret=GrantsManagementSystemGovernmentOfIndiaSecretKeyForJWTAuthentication2026SecureMustBe256Bits
jwt.expirationMs=86400000

# CORS
cors.allowed-origins=http://localhost:4200,http://127.0.0.1:4200
